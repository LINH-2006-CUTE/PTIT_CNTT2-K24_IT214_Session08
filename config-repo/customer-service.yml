server:
  port: ${PORT:8091}

spring:
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:mysql://localhost:3307/customer_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234$}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
      continue-on-error: false

