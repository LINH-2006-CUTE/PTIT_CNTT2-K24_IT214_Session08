services:
  customer-db:
    image: mysql:8.4
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: '1234$'
      MYSQL_DATABASE: customer_db
    volumes: [customer-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234$"]
      interval: 5s
      timeout: 3s
      retries: 20

  product-db:
    image: mysql:8.4
    ports: ["3308:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: '1234$'
      MYSQL_DATABASE: product_db
    volumes: [product-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234$"]
      interval: 5s
      timeout: 3s
      retries: 20

  inventory-db:
    image: mysql:8.4
    ports: ["3309:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: '1234$'
      MYSQL_DATABASE: inventory_db
    volumes: [inventory-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234$"]
      interval: 5s
      timeout: 3s
      retries: 20

  order-db:
    image: mysql:8.4
    ports: ["3310:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: '1234$'
      MYSQL_DATABASE: order_db
    volumes: [order-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234$"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-db:
    image: mysql:8.4
    ports: ["3311:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: '1234$'
      MYSQL_DATABASE: payment_db
    volumes: [payment-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234$"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  customer-data:
  product-data:
  inventory-data:
  order-data:
  payment-data:

