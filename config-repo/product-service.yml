server:
  port: ${PORT:8092}

spring:
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:mysql://localhost:3308/product_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234$}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always

